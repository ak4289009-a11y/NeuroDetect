<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Diagnostic Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="4"/>

  <!-- Brain Hemisphere Outlines -->
  <path d="M 240 130 C 200 130, 160 155, 145 195 C 130 230, 140 270, 130 300 C 120 330, 140 370, 180 380 C 210 388, 230 375, 240 365 Z" 
        fill="rgba(255,255,255,0.08)" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 272 130 C 312 130, 352 155, 367 195 C 382 230, 372 270, 382 300 C 392 330, 372 370, 332 380 C 302 388, 282 375, 272 365 Z" 
        fill="rgba(255,255,255,0.08)" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Division -->
  <line x1="256" y1="130" x2="256" y2="365" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-dasharray="8 6"/>

  <!-- Neural ECG Pulse Line -->
  <polyline points="90,270 180,270 210,210 240,320 270,180 300,310 330,270 422,270" 
            fill="none" stroke="url(#pulseGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Target Neoplasm Focal Heatmap Glow (Grad-CAM indicator) -->
  <circle cx="320" cy="220" r="30" fill="rgba(239, 68, 68, 0.45)" filter="url(#glow)"/>
  <circle cx="320" cy="220" r="16" fill="#EF4444" filter="url(#glow)"/>
  <circle cx="320" cy="220" r="8" fill="#FDE047"/>
</svg>
